[Manager]
# systemd pets /dev/watchdog0 (sunxi hardware watchdog) every RuntimeWatchdogSec/2.
# If PID 1 itself stops running (full lockup, interrupts disabled), the
# hardware fires a warm SoC reset after RuntimeWatchdogSec with no further
# software involvement.
RuntimeWatchdogSec=30
RebootWatchdogSec=30
